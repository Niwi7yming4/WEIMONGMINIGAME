<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舉手投足我就是騙 — Loading R5</title><style>html,body{margin:0;height:100%;background:#09090d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}.box{border:4px solid #111;background:#ffe300;color:#111;box-shadow:10px 10px #00eaff;padding:22px;max-width:520px}.bar{height:12px;background:#111;margin-top:14px;overflow:hidden}.fill{height:100%;width:20%;background:#ff0055;animation:p 1s infinite alternate}@keyframes p{to{width:100%}}</style></head><body><div class="box"><b>R5 QUICKPLAY</b><div>正在組裝靜態測試版…</div><div class="bar"><div class="fill"></div></div><small>若載入失敗，請重新整理；Three.js 仍需網路載入。</small></div><script>(async()=>{const files=['page/page.part01.txt','page/page.part02.txt','page/page.part03.txt','page/page.part04.txt'];const text=(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}))).join('');document.open();document.write(text);document.close()})().catch(e=>{document.body.innerHTML='<div class="box"><b>LOAD ERROR</b><pre style="white-space:pre-wrap">'+String(e)+'</pre></div>'})</script></body></html>
